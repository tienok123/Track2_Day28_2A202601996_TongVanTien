points:
- demo_evidence: "evidence/ip01-kafka-consume.json \u2014 message with traceparent\
    \ header on data.raw"
  health_signal: Kafka broker reachable; data.raw topic exists with configured retention
  id: IP01
  input_contract: contracts.FeedbackSubmission | contracts.DocumentSubmission (HTTP,
    via gateway)
  layer: L2 Data
  metrics:
  - lab28_ingestion_events_total
  - lab28_ingestion_publish_seconds
  output_contract: contracts.IngestionEvent on topic data.raw, key = idempotency_key
  owner: team-ingestion
  readiness_check: reliability.kafka_topics
  slide_name: "Data ingestion \u2192 Kafka"
  tests:
  - IT-J1-golden-path
  - IT-J2-idempotent-replay
  - UT-contracts-ingestion
- demo_evidence: "evidence/ip02-airflow-run.json \u2014 DAG run id, task states, asset\
    \ event"
  health_signal: Airflow api-server /api/v2/monitor/health reports scheduler+triggerer
    healthy
  id: IP02
  input_contract: contracts.IngestionEvent consumed from data.raw with W3C traceparent
    header
  layer: L2 Data
  metrics:
  - lab28_pipeline_batches_total
  - lab28_consumer_lag
  output_contract: Airflow 3 asset event on asset lab28://delta/feedback; run_id recorded
  owner: team-ingestion
  readiness_check: reliability.airflow_pipeline
  slide_name: "Kafka \u2192 Airflow pipeline"
  tests:
  - IT-J1-golden-path
  - IT-J4-degraded-recovery
- demo_evidence: "evidence/ip03-delta-history.json \u2014 transaction log, schema,\
    \ time travel diff"
  health_signal: DeltaTable.history() readable and version monotonically increasing
  id: IP03
  input_contract: Batch of contracts.IngestionEvent (deduplicated by idempotency_key)
  layer: L2 Data
  metrics:
  - lab28_delta_version
  - lab28_delta_rows_written_total
  output_contract: Delta MERGE into feedback/documents tables; new table version;
    _delta_log entry
  owner: team-data
  readiness_check: reliability.delta_transaction_log
  slide_name: "Pipeline \u2192 Delta Lake / Lakehouse"
  tests:
  - IT-J1-golden-path
  - IT-J2-idempotent-replay
  - UT-delta-merge-idempotency
- demo_evidence: "evidence/ip04-feast-online.json \u2014 entity row with delta_version\
    \ and freshness"
  health_signal: Feast feature server /health 200 and get-online-features returns
    the entity
  id: IP04
  input_contract: Delta-derived offline snapshot at delta_root/exports/asker_activity
  layer: L3 ML
  metrics:
  - lab28_feature_lookup_seconds
  - lab28_feature_freshness_seconds
  output_contract: Feast online store rows for entity asker_id; feature service asker_serving_v1
  owner: team-data
  readiness_check: reliability.feature_store
  slide_name: "Lakehouse \u2192 Feature Store (Feast)"
  tests:
  - IT-J1-golden-path
  - IT-J4-degraded-recovery
- demo_evidence: "evidence/ip05-qdrant-search.json \u2014 hybrid query result with\
    \ scores and doc_ids"
  health_signal: Qdrant /readyz 200 and collection point count > 0
  id: IP05
  input_contract: Document rows from Delta + pinned embedding model
  layer: L2 Data
  metrics:
  - lab28_retrieval_seconds
  - lab28_vector_points
  output_contract: Qdrant points in lab28_documents with deterministic UUID from doc_id
  owner: team-serving
  readiness_check: reliability.vector_store
  slide_name: "Data \u2192 Vector Store (embeddings)"
  tests:
  - IT-J1-golden-path
  - IT-J2-idempotent-replay
  - UT-vector-stable-ids
- demo_evidence: "evidence/ip06-mlflow-release.json \u2014 version, signature, git\
    \ sha, delta version"
  health_signal: MLflow /health 200 and get_model_version_by_alias(champion) resolves
  id: IP06
  input_contract: Evaluation run over the Delta version + retrieval config + vLLM
    model id
  layer: L3 ML
  metrics:
  - lab28_release_version_info
  output_contract: Registered model version with signature, tags, provenance and champion
    alias
  owner: team-data
  readiness_check: operations.model_rollback
  slide_name: "MLflow \u2192 Model Registry"
  tests:
  - IT-J1-golden-path
  - IT-J3-promotion-rollback
  - UT-release-provenance
- demo_evidence: "evidence/ip07-vllm-identity.json \u2014 /version + /v1/models +\
    \ vllm: metric names"
  gate: gpu
  gate_note: 'Requires a real GPU-backed vLLM 0.28 endpoint. A mock, a CPU classifier
    or any server that cannot produce vLLM''s own /version and vllm: metrics fails
    this gate by design.'
  health_signal: 'vLLM /health 200, /version reports a vLLM build, /metrics exposes
    vllm: series'
  id: IP07
  input_contract: Grounded prompt built from champion release config + retrieved sources
  layer: L1 Compute
  metrics:
  - lab28_llm_seconds
  - lab28_llm_tokens_total
  output_contract: OpenAI-compatible chat completion from a real vLLM server; model
    id echoed
  owner: team-serving
  readiness_check: reliability.inference_endpoint
  slide_name: "Model \u2192 vLLM / SGLang serving"
  tests:
  - IT-J1-golden-path
  - IT-J3-promotion-rollback
  - IT-J4-degraded-recovery
- demo_evidence: "evidence/ip08-gateway.json \u2014 200 + 429 responses with x-request-id"
  health_signal: Gateway admin /ready 200; /healthz route answers without hitting
    the app
  id: IP08
  input_contract: External HTTP request to the gateway listener
  layer: L1 Compute
  metrics:
  - envoy_http_downstream_rq_total
  - envoy_http_local_rate_limit_rate_limited
  output_contract: Routed request with x-request-id; rate limit, auth policy and health
    routing
  owner: team-platform
  readiness_check: security.gateway_policy
  slide_name: "Serving \u2192 API Gateway"
  tests:
  - IT-J1-golden-path
  - IT-J5-trace-metrics-continuity
  - IT-gateway-rate-limit
- demo_evidence: evidence/ip09-prometheus-targets.json + evidence/ip09-grafana-dashboards.json
  health_signal: Prometheus /api/v1/targets shows all expected jobs up
  id: IP09
  input_contract: Prometheus scrape of every service that exposes /metrics
  layer: L4 Ops
  metrics:
  - up
  - lab28_request_seconds
  output_contract: Provisioned Grafana dashboards and at least one actionable SLO
    alert
  owner: team-platform
  readiness_check: observability.metrics_and_alerts
  slide_name: "All components \u2192 Prometheus / Grafana"
  tests:
  - IT-J5-trace-metrics-continuity
  - IT-prometheus-targets
- demo_evidence: "evidence/ip10-trace.json \u2014 trace ID with the required span\
    \ names"
  gate: langsmith
  gate_note: The local OTLP backend provides deterministic offline and CI evidence.
    The LangSmith leg additionally requires LANGSMITH_API_KEY in the environment and
    is reported UNVERIFIED when no credential is supplied.
  health_signal: Collector pipeline healthy; trace queryable by ID in the local backend
  id: IP10
  input_contract: OTLP spans from gateway, API, Kafka, Airflow, Spark, Feast, Qdrant,
    vLLM
  layer: L4 Ops
  metrics:
  - otelcol_exporter_sent_spans
  - otelcol_exporter_send_failed_spans
  output_contract: One trace ID spanning every boundary, exported to a local backend
    and LangSmith
  owner: team-platform
  readiness_check: observability.trace_continuity
  slide_name: "All components \u2192 LangSmith tracing"
  tests:
  - IT-J5-trace-metrics-continuity
  - IT-trace-span-coverage
required_spans:
- lab28.gateway.renamed
- lab28.api.ingest
- lab28.kafka.produce
- lab28.kafka.consume
- lab28.airflow.dag
- lab28.spark.delta_merge
- lab28.api.ask
- lab28.feast.get_online_features
- lab28.qdrant.query
- lab28.mlflow.resolve_release
- lab28.vllm.chat_completion
roles:
  team-data: "Data & ML \u2014 Spark/Delta, Feast repository, materialization, model\
    \ release"
  team-ingestion: "Ingestion & Orchestration \u2014 Kafka topics, producers, Airflow\
    \ DAG, DLQ/replay"
  team-platform: "Platform & Observability \u2014 gateway, OTEL collector, Prometheus,\
    \ Grafana, K8s/GitOps"
  team-presenter: "Presenter / Incident Commander \u2014 demo script, evidence pack,\
    \ failure narration"
  team-serving: "Serving & Retrieval \u2014 FastAPI orchestration, Qdrant, vLLM client,\
    \ degraded paths"
rubric:
- criterion: Integration Completeness
  description: All 10 integration points working, data flows end-to-end
  weight: 40
- criterion: Observability
  description: Logs, metrics, traces visible; alerts configured; SLO dashboard
  weight: 25
- criterion: Performance
  description: Latency within SLO; load tested; no memory leaks
  weight: 20
- criterion: Architecture Quality
  description: Clean separation, GitOps config, documented decisions
  weight: 15
schema_version: '1'
slide: Day 28 - Track 2 - Platform Engineering Documentation
slide_section: "Milestone 3 Demo Requirements \u2014 10 integration points"
